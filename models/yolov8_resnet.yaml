# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with ResNet backbone

# Parameters
nc: 80  # number of classes
scales:  # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  n: [0.33, 0.50, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# ResNet Backbone (Replaces YOLOv8 backbone)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 7, 2]]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  
  - [-1, 1, ResNetLayer, [32, 16, 2, False, 1, 4]]
  - [-1, 1, ResNetLayer, [64, 16, 1, False, 1, 4]] 
  - [-1, 1, ResNetLayer, [64, 32, 2, False, 1, 4]] 
  - [-1, 1, ResNetLayer, [128, 64, 1, False, 1, 4]]   
  - [-1, 1, ResNetLayer, [256, 64, 2, False, 1, 4]] 
  - [-1, 1, ResNetLayer, [256, 128, 1, False, 1, 4]] 
  - [-1, 1, ResNetLayer, [512, 128, 2, False, 1, 4]] 
  
  - [-1, 1, SPPF, [512, 5]] 

# YOLOv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]
